<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cetak Sertifikat</title>
<style>
  /* ====== GESER DI SINI KALAU HASIL CETAK MELESET DARI KERTAS PRE-PRINT ====== */
  :root{
    --page-w: 215mm;
    --page-h: 330mm;       /* F4. Kalau printer Anda mendefinisikan F4 beda, ubah di sini */
    --margin-top: 15mm;
    --margin-left: 20mm;
    --margin-right: 15mm;
    --font-size: 10.5pt;
    --line-h: 1.35;
  }
  *{box-sizing:border-box}
  body{margin:0; background:#ccc; font-family:Arial, Helvetica, sans-serif; font-size:var(--font-size); line-height:var(--line-h); color:#111}
  .page{
    width:var(--page-w); min-height:var(--page-h); background:#fff; margin:16px auto;
    padding:var(--margin-top) var(--margin-right) 15mm var(--margin-left);
    box-shadow:0 4px 16px rgba(0,0,0,.25); position:relative;
  }
  .toolbar{
    position:sticky; top:0; background:#1c2333; color:#fff; padding:10px 16px; display:flex; gap:10px; align-items:center;
    justify-content:center; z-index:10; font-family:Arial,sans-serif;
  }
  .toolbar button{background:#3b77d7; color:#fff; border:none; padding:9px 18px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer}
  .toolbar span{font-size:12px; opacity:.8}

  h1.title{font-size:13pt; font-weight:bold; text-align:center; margin:0 0 4mm; letter-spacing:.5px}
  .headrow{display:flex; justify-content:space-between; margin-bottom:6mm; font-size:9.5pt}

  .sectiontitle{font-weight:bold; font-size:10.5pt; margin:6mm 0 1mm; text-transform:none}
  .sectionsub{font-size:8.5pt; font-style:italic; margin-bottom:3mm; color:#333}

  table.fields{width:100%; border-collapse:collapse; margin-bottom:2mm}
  table.fields td{padding:1.2mm 2mm; vertical-align:top; font-size:var(--font-size)}
  table.fields td.no{width:6mm}
  table.fields td.label{width:56mm}
  table.fields td.colon{width:4mm}

  table.perf{width:100%; border-collapse:collapse; margin-top:2mm; font-size:9pt}
  table.perf th, table.perf td{border:0.4pt solid #999; padding:1.5mm 2mm; text-align:center}
  table.perf th{font-weight:bold; background:#f3f3f3}
  table.perf td.paramcol{text-align:left}

  .signblock{margin-top:14mm; display:flex; justify-content:flex-end}
  .signbox{text-align:center; width:60mm; font-size:var(--font-size)}
  .signbox .space{height:20mm}

  .footnote{margin-top:8mm; font-size:8pt; line-height:1.4; text-align:justify}

  @media print{
    body{background:#fff}
    .toolbar{display:none}
    .page{box-shadow:none; margin:0; page-break-after:always}
    .page:last-child{page-break-after:auto}
    @page{ size: var(--page-w) var(--page-h); margin:0; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span id="jobLabel">Memuat…</span>
  <button onclick="window.print()">🖨️ Cetak</button>
</div>

<div id="content"><p style="text-align:center;padding:40px">Memuat data…</p></div>

<script>
const API_BASE = 'https://script.google.com/macros/s/AKfycby-LcxnGqEaA203sl3pIEPMsG2X0PBZIWJYCEIaxd5EISGp2YirfkAe6Jr1t5oYUynAVQ/exec';
const MODEL_LABEL = { PO: 'Oximeter', BPM: 'Tensimeter' };

async function apiGet(action, params){
  const qs = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(API_BASE + '?' + qs);
  return res.json();
}

function fmtTgl(d){
  if(!d) return '-';
  const dt = new Date(d);
  return dt.toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' });
}
function tglBerakhir(d){
  if(!d) return '-';
  const dt = new Date(d); dt.setDate(dt.getDate()+365);
  return fmtTgl(dt);
}

async function init(){
  const params = new URLSearchParams(location.search);
  const jobId = params.get('job_id');
  if (!jobId){ document.getElementById('content').innerHTML = '<p style="text-align:center;padding:40px">Parameter job_id tidak ada di URL.</p>'; return; }

  const [d, cfg] = await Promise.all([
    apiGet('jobDetail', { job_id: jobId }),
    apiGet('config', { model_id: '' }) // diisi ulang setelah tahu model_id
  ]);
  if (d.error){ document.getElementById('content').innerHTML = '<p style="text-align:center;padding:40px">' + d.error + '</p>'; return; }
  const j = d.job;
  const modelCfg = await apiGet('config', { model_id: j.model_id });
  const model = modelCfg.model;

  document.getElementById('jobLabel').textContent = j.job_id + ' — ' + j.nama_pelanggan + ' (' + (j.no_sertifikat || 'belum terbit') + ')';

  const fisikBaik = d.fisik.length > 0 && d.fisik.every(f => f.fisik === 'Baik' && f.fungsi === 'Baik');

  // Kelompokkan hasil per parameter_group untuk tabel performa
  const groups = {};
  d.hasil.forEach(h => { if(!groups[h.parameter_group]) groups[h.parameter_group]=[]; groups[h.parameter_group].push(h); });

  document.getElementById('content').innerHTML = `
    <!-- ===================== HALAMAN 1: SERTIFIKAT KALIBRASI ===================== -->
    <div class="page">
      <h1 class="title">SERTIFIKAT KALIBRASI</h1>
      <div class="headrow">
        <div>No Sertifikat : <b>${j.no_sertifikat || '-'}</b></div>
        <div>No Order : <b>${j.no_order}</b></div>
      </div>

      <div class="sectiontitle">Identifikasi Alat</div>
      <table class="fields">
        <tr><td class="no">1</td><td class="label">Nama Alat</td><td class="colon">:</td><td>${model.nama_alat_formal}</td></tr>
        <tr><td class="no">2</td><td class="label">Merk Pabrik</td><td class="colon">:</td><td>${j.merk}</td></tr>
        <tr><td class="no">3</td><td class="label">Tipe / Model</td><td class="colon">:</td><td>${j.tipe_model_alat}</td></tr>
        <tr><td class="no">4</td><td class="label">No. Seri</td><td class="colon">:</td><td>${j.no_seri}</td></tr>
        <tr><td class="no">5</td><td class="label">Tanggal Penerimaan</td><td class="colon">:</td><td>${fmtTgl(j.tanggal_terima)}</td></tr>
      </table>

      <div class="sectiontitle">Identitas Pemilik</div>
      <table class="fields">
        <tr><td class="no">1</td><td class="label">Nama Pelanggan</td><td class="colon">:</td><td>${j.nama_pelanggan}</td></tr>
        <tr><td class="no">2</td><td class="label">Alamat</td><td class="colon">:</td><td>${j.alamat_pelanggan}</td></tr>
      </table>

      <div class="sectiontitle">Pelaksanaan Kalibrasi</div>
      <table class="fields">
        <tr><td class="no">1</td><td class="label">Tempat</td><td class="colon">:</td><td>${model.tempat_kalibrasi_default}</td></tr>
        <tr><td class="no">2</td><td class="label">Ruangan</td><td class="colon">:</td><td>${model.ruang_kalibrasi_default}</td></tr>
        <tr><td class="no">3</td><td class="label">Tanggal</td><td class="colon">:</td><td>${fmtTgl(j.tanggal_kalibrasi)}</td></tr>
        <tr><td class="no">4</td><td class="label">Tanggal Berakhir</td><td class="colon">:</td><td>${tglBerakhir(j.tanggal_kalibrasi)}</td></tr>
        <tr><td class="no">5</td><td class="label">Metode</td><td class="colon">:</td><td>${model.metode}</td></tr>
        <tr><td class="no">6</td><td class="label">Hasil Kalibrasi</td><td class="colon">:</td><td><b>${j.hasil_akhir === 'LAIK' ? 'ALAT BAIK DAN LAIK PAKAI' : 'TIDAK LAIK PAKAI'}</b></td></tr>
      </table>

      <div class="signblock">
        <div class="signbox">
          <div>Surabaya, ${fmtTgl(j.tanggal_terbit_pdf || new Date())}</div>
          <div>Menyetujui,</div>
          <div class="space"></div>
          <div><b>${j.disahkan_oleh || '.......................'}</b></div>
          <div>Manager Mutu</div>
        </div>
      </div>

      <div class="footnote">
        Sertifikat ini dilarang digandakan kecuali sepenuhnya tanpa persetujuan tertulis oleh Laboratorium Kalibrasi PT. Sinko Prima Alloy.
        This Certificate shall not reproduce except in full without written approval of PT. Sinko Prima Alloy Calibration Laboratory.
      </div>
    </div>

    <!-- ===================== HALAMAN 2: LAPORAN HASIL KALIBRASI ===================== -->
    <div class="page">
      <h1 class="title">LAPORAN HASIL KALIBRASI</h1>
      <div class="headrow"><div>No. Sertifikat : <b>${j.no_sertifikat || '-'}</b></div><div></div></div>

      <div class="sectiontitle">I. Data Alat</div>
      <table class="fields">
        <tr><td class="no">1</td><td class="label">Nama Alat</td><td class="colon">:</td><td>${model.nama_alat_formal}</td></tr>
        <tr><td class="no">2</td><td class="label">Merek</td><td class="colon">:</td><td>${j.merk}</td></tr>
        <tr><td class="no">3</td><td class="label">Model/Tipe</td><td class="colon">:</td><td>${j.tipe_model_alat}</td></tr>
        <tr><td class="no">4</td><td class="label">No. Seri</td><td class="colon">:</td><td>${j.no_seri}</td></tr>
        <tr><td class="no">5</td><td class="label">Kelas Proteksi</td><td class="colon">:</td><td>${model.kelas_proteksi_default}</td></tr>
        <tr><td class="no">6</td><td class="label">Tipe Applied Parts</td><td class="colon">:</td><td>${model.tipe_applied_parts_default}</td></tr>
        <tr><td class="no">7</td><td class="label">Resolusi</td><td class="colon">:</td><td>${j.resolusi}</td></tr>
        <tr><td class="no">8</td><td class="label">Tanggal Kalibrasi</td><td class="colon">:</td><td>${fmtTgl(j.tanggal_kalibrasi)}</td></tr>
      </table>

      <div class="sectiontitle">II. Kondisi Lingkungan</div>
      <table class="fields">
        <tr><td class="no">1</td><td class="label">Suhu</td><td class="colon">:</td><td>(${j.suhu_awal} - ${j.suhu_akhir}) °C</td></tr>
        <tr><td class="no">2</td><td class="label">Kelembapan</td><td class="colon">:</td><td>(${j.rh_awal} - ${j.rh_akhir}) %RH</td></tr>
      </table>

      <div class="sectiontitle">III. Pemeriksaan Kondisi Fisik dan Fungsi</div>
      <table class="fields">
        <tr><td class="no">1</td><td class="label">Fisik</td><td class="colon">:</td><td>${fisikBaik ? 'Baik' : 'Tidak Baik'}</td></tr>
        <tr><td class="no">2</td><td class="label">Fungsi</td><td class="colon">:</td><td>${fisikBaik ? 'Baik' : 'Tidak Baik'}</td></tr>
      </table>

      <div class="sectiontitle">IV. Hasil Pengukuran Kinerja</div>
      ${Object.keys(groups).map(g => `
        <div class="sectionsub">${g}</div>
        <table class="perf">
          <tr><th>No</th><th>Parameter</th><th>Setting Standar</th><th>Rata-rata Pembacaan</th><th>Koreksi</th><th>Nilai Penyimpangan Diizinkan</th><th>Ketidakpastian</th></tr>
          ${groups[g].map((h,i) => `<tr>
            <td>${i+1}</td><td class="paramcol">${h.sub_parameter}</td><td>${h.nilai_setting}</td>
            <td>${h.rata_rata_pembacaan}</td><td>${h.koreksi}</td>
            <td>${h.nilai_penyimpangan_diizinkan}</td><td>${h.ketidakpastian_U}</td>
          </tr>`).join('')}
        </table>
      `).join('')}

      <div class="sectiontitle">V. Keterangan</div>
      <div class="footnote">
        ${model.metode_rujukan_text}
        ${model.catatan_klasifikasi ? '<br>' + model.catatan_klasifikasi : ''}
        <br>Hasil kalibrasi di atas hanya untuk alat yang tertera pada Sertifikat ini.
        <br><b>${j.hasil_akhir === 'LAIK' ? 'ALAT BAIK DAN LAIK PAKAI' : 'TIDAK LAIK PAKAI'}</b>
      </div>
    </div>
  `;
}
init();
</script>
</body>
</html>
