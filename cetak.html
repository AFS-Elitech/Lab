<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cetak Sertifikat</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
<style>
  :root{
    --page-w: 215mm;
    --page-h: 330mm;
    --margin-top: 30mm;
    --margin-left: 18mm;
    --margin-right: 15mm;
    --margin-bottom: 12mm;
    --font-size: 10.5pt;
    --line-h: 1.35;
    --font-serif: 'Times New Roman', Times, 'Liberation Serif', serif;
    --blue:#3b77d7; --blue-tint:#e9f0fb; --ink:#1c2333; --ink-soft:#6d7688; --line:#e6e9ef;
  }
  *{box-sizing:border-box}
  body{margin:0; background:#ccc; font-family:Arial, Helvetica, sans-serif; font-size:var(--font-size); line-height:var(--line-h); color:#111}
  .page{
    width:var(--page-w); min-height:var(--page-h); background:#fff; margin:16px auto;
    padding:var(--margin-top) var(--margin-right) var(--margin-bottom) var(--margin-left);
    box-shadow:0 4px 16px rgba(0,0,0,.25); position:relative;
    font-family:var(--font-serif);
  }
  .toolbar{
    position:sticky; top:0; background:#1c2333; color:#fff; padding:10px 16px; display:flex; gap:10px; align-items:center;
    justify-content:center; flex-wrap:wrap; z-index:10; font-family:Arial,sans-serif;
  }
  .toolbar button{background:var(--blue); color:#fff; border:none; padding:9px 18px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; transition:opacity .2s}
  .toolbar button:disabled{background:#4b5468; color:#9aa1b3; cursor:not-allowed; opacity:.7}
  .toolbar button#btnExcel{background:#15a45a}
  .toolbar button#btnExcel:disabled{background:#4b5468}
  .toolbar span{font-size:12px; opacity:.8}
  .toolbar .note{width:100%; text-align:center; font-size:11.5px; color:#ffd7a8; opacity:.95}

  .loading-overlay{
    position:fixed; inset:0; background:rgba(242,244,247,.9); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    z-index:100; font-family:Arial,sans-serif;
  }
  .loading-overlay.hide{display:none}
  .spinner{width:40px; height:40px; border:4px solid var(--blue-tint); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-overlay span{font-size:13px; font-weight:700; color:var(--ink-soft)}

  h1.title{font-size:15.5pt; font-weight:bold; text-align:center; margin:0 0 5mm; letter-spacing:.3px}
  h1.title .en{font-weight:normal; font-size:11.5pt}

  .headrow{display:flex; justify-content:center; gap:16mm; margin-bottom:6mm; font-size:9.5pt; flex-wrap:wrap}

  .sectiontitle{font-weight:bold; font-size:11.5pt; margin:6mm 0 0.5mm}
  .sectionsub{font-size:8.5pt; font-style:italic; margin-bottom:3mm; color:#333}

  table.fields{width:100%; border-collapse:collapse; margin-bottom:1mm}
  table.fields td{padding:1.1mm 2mm; vertical-align:top; font-size:var(--font-size)}
  table.fields td.no{width:6mm; text-align:right}
  table.fields td.label{width:66mm; font-weight:bold}
  table.fields td.label2{width:66mm; font-weight:normal}
  table.fields td.colon{width:4mm; font-weight:bold}
  table.fields td.val{}
  table.fields td.val.bold{font-weight:bold}

  table.perf{width:100%; border-collapse:collapse; margin-top:1.5mm; font-size:9.5pt}
  table.perf th, table.perf td{border:0.4pt solid #999; padding:1.6mm 1.8mm; text-align:center; vertical-align:middle}
  table.perf th{font-weight:bold; background:#f3f3f3; font-size:8.5pt; line-height:1.25}
  table.perf th.unit{font-weight:normal; font-style:normal; background:#f8f8f8; font-size:8pt}
  table.perf td.paramcol{text-align:center}

  .subsec{font-weight:bold; font-size:var(--font-size); margin:3mm 0 1mm}

  .signblock{margin-top:12mm; display:flex; justify-content:flex-end}
  .signbox{text-align:center; width:60mm; font-size:var(--font-size)}
  .signbox .space{height:18mm}
  .signbox .bhs{font-style:italic; font-size:9pt}

  .diperiksa{margin-top:10mm; font-size:var(--font-size)}

  .dblrule{margin-top:6mm}
  .dblrule .r1, .dblrule .r2{border-top:1.6pt solid #000}
  .dblrule .r1{margin-bottom:1.1mm}

  .footnote{margin-top:3mm; font-size:8pt; line-height:1.4; text-align:center}
  .akhir{font-weight:bold; font-size:var(--font-size); margin-top:8mm}
  .tglbuat{margin-top:5mm; font-size:8.5pt}

  .pagefooter{
    position:absolute; left:var(--margin-left); right:var(--margin-right); bottom:6mm;
    display:flex; justify-content:space-between; align-items:flex-end; font-size:8pt; color:#333;
  }
  .pagefooter .pageno{flex:1; text-align:center}
  .pagefooter .docnum{font-style:italic; text-align:right; white-space:nowrap}

  @media print{
    body{background:#fff}
    .toolbar, .loading-overlay{display:none}
    .page{box-shadow:none; margin:0; page-break-after:always}
    .page:last-child{page-break-after:auto}
    @page{ size: var(--page-w) var(--page-h); margin:0; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span id="jobLabel">Memuat…</span>
  <button id="btnPrint" disabled>🖨️ Cetak</button>
  <button id="btnExcel" disabled>⬇️ Unduh Excel</button>
  <div class="note" id="statusNote" style="display:none"></div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span>Memuat data sertifikat…</span>
</div>

<div id="content"></div>

<script>
const API_BASE = 'https://script.google.com/macros/s/AKfycby-LcxnGqEaA203sl3pIEPMsG2X0PBZIWJYCEIaxd5EISGp2YirfkAe6Jr1t5oYUynAVQ/exec';
const GROUP_LABEL = { SpO2: 'Saturasi Oksigen', HeartRate: 'Heart Rate', NIBP: 'Tekanan Darah (NIBP)' };

async function apiGet(action, params){
  const qs = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(API_BASE + '?' + qs);
  return res.json();
}

function esc(v){ return (v === null || v === undefined) ? '' : String(v); }
function r0(v){
  const n = Number(v);
  if (v === '' || v === null || v === undefined || isNaN(n)) return esc(v);
  return String(Math.round(n));
}
function r0n(v){
  const n = Number(v);
  return isNaN(n) ? esc(v) : Math.round(n);
}
function noteRow(no, text){
  return `<tr><td class="no">${no}</td><td colspan="3" class="val">${text}</td></tr>`;
}
function fmtTgl(d){
  if(!d) return '-';
  const dt = new Date(d);
  if (isNaN(dt)) return '-';
  return dt.toLocaleDateString('id-ID', { day:'2-digit', month:'long', year:'numeric' });
}
function tglBerakhir(d){
  if(!d) return '-';
  const dt = new Date(d); if (isNaN(dt)) return '-';
  dt.setDate(dt.getDate()+365);
  return fmtTgl(dt);
}
function fieldRow(no, label, value, bold){
  return `<tr><td class="no">${no}</td><td class="label">${label}</td><td class="colon">:</td><td class="val${bold?' bold':''}">${value}</td></tr>`;
}
function fieldRowBi(no, idLabel, enLabel, value){
  return `<tr><td class="no">${no}</td><td class="label2"><b>${idLabel}</b> / ${enLabel}</td><td class="colon">:</td><td class="val">${value}</td></tr>`;
}
function dblRuleHtml(){
  return `<div class="dblrule"><div class="r1"></div><div class="r2"></div></div>`;
}

function renderSertifikat(j, model){
  const hasilText = j.hasil_akhir === 'LAIK' ? 'ALAT BAIK DAN LAIK PAKAI' : 'TIDAK LAIK PAKAI';
  const managerMutu = model.manager_mutu_default || j.disahkan_oleh || '.......................';
  return `
  <div class="page">
    <h1 class="title">SERTIFIKAT KALIBRASI<br><span class="en">Calibration Certificate</span></h1>
    <div class="headrow">
      <div>No Sertifikat : <b>${esc(j.no_sertifikat) || '-'}</b></div>
      <div>No Order : <b>${esc(j.no_order)}</b></div>
    </div>

    <div class="sectiontitle">Identifikasi Alat</div>
    <div class="sectionsub">Equipment Identification</div>
    <table class="fields">
      ${fieldRowBi(1, 'Nama Alat', 'Name of Equipment', esc(model.nama_alat_formal))}
      ${fieldRowBi(2, 'Merk Pabrik', 'Manufacturer', esc(j.merk))}
      ${fieldRowBi(3, 'Tipe / Model', 'Type / Model', esc(j.tipe_model_alat))}
      ${fieldRowBi(4, 'No.Seri', 'Serial Number', esc(j.no_seri))}
      ${fieldRowBi(5, 'Tanggal Penerimaan', 'Receipt Date', fmtTgl(j.tanggal_terima))}
    </table>

    <div class="sectiontitle">Identitas Pemilik</div>
    <div class="sectionsub">Owner's Identity</div>
    <table class="fields">
      ${fieldRowBi(1, 'Nama Pelanggan', "Customer's Name", esc(j.nama_pelanggan))}
      ${fieldRowBi(2, 'Alamat', 'Address', esc(j.alamat_pelanggan))}
    </table>

    <div class="sectiontitle">Pelaksanaan Kalibrasi</div>
    <div class="sectionsub">Implementation of Calibration</div>
    <table class="fields">
      ${fieldRowBi(1, 'Tempat', 'Place', esc(model.tempat_kalibrasi_default))}
      ${fieldRowBi(2, 'Ruangan', 'Room', esc(model.ruang_kalibrasi_default))}
      ${fieldRowBi(3, 'Tanggal Kalibrasi', 'Cal Date', fmtTgl(j.tanggal_kalibrasi))}
      ${fieldRowBi(4, 'Tanggal Berakhir', 'Cal Due Date', tglBerakhir(j.tanggal_kalibrasi))}
      ${fieldRowBi(5, 'Metode', 'Method', esc(model.metode))}
      ${fieldRowBi(6, 'Hasil Kalibrasi', 'Calibration Result', `<b>${hasilText}</b>`)}
    </table>

    <div class="signblock">
      <div class="signbox">
        <div>Surabaya, ${fmtTgl(j.tanggal_terbit_pdf || new Date())}</div>
        <div>Menyetujui,</div>
        <div class="bhs">Approved,</div>
        <div class="space"></div>
        <div><b>${esc(managerMutu)}</b></div>
        <div>Manager Mutu</div>
        <div class="bhs">Quality Manager</div>
      </div>
    </div>

    ${dblRuleHtml()}
    <div class="footnote">
      Sertifikat ini dilarang digandakan kecuali sepenuhnya tanpa persetujuan tertulis oleh Laboratorium Kalibrasi PT. Sinko Prima Alloy.<br>
      This Certificate shall not reproduce except in full without written approval of PT. Sinko Prima Alloy Calibration Laboratory.
    </div>

    <div class="pagefooter">
      <span></span>
      <span class="pageno">Page 1 of 2</span>
      <span class="docnum">Nomor Dokumen:SPA-FR/LAB-03PBK</span>
    </div>
  </div>`;
}

function renderPerfTable(groupName, rows, satuan){
  const subs = [...new Set(rows.map(r => r.sub_parameter))];
  const isMulti = subs.length > 1;
  if (!isMulti){
    return `
      <table class="perf">
        <tr>
          <th>No</th><th>Pembacaan Standar</th><th>Rata-rata Pembacaan Alat</th>
          <th>Koreksi</th><th>Nilai Penyimpangan yang diizinkan</th><th>Ketidakpastian Pengukuran</th>
        </tr>
        <tr>
          <th class="unit"></th><th class="unit">(${satuan})</th><th class="unit">(${satuan})</th>
          <th class="unit">(${satuan})</th><th class="unit"></th><th class="unit">(${satuan})</th>
        </tr>
        ${rows.map((h,i) => `<tr>
          <td>${i+1}</td><td>${h.nilai_setting}</td><td>${r0(h.rata_rata_pembacaan)}</td>
          <td>${r0(h.koreksi)}</td><td>${h.nilai_penyimpangan_diizinkan}</td><td>${r0(h.ketidakpastian_U)}</td>
        </tr>`).join('')}
      </table>`;
  }
  const nSub = subs.length;
  let body = '';
  for (let i = 0; i < rows.length; i += nSub){
    const chunk = rows.slice(i, i + nSub);
    chunk.forEach((h, k) => {
      body += '<tr>';
      if (k === 0) body += `<td rowspan="${nSub}">${(i/nSub)+1}</td>`;
      body += `<td class="paramcol">${h.sub_parameter}</td>`;
      body += `<td>${h.nilai_setting}</td><td>${r0(h.rata_rata_pembacaan)}</td>`;
      body += `<td>${r0(h.koreksi)}</td><td>${h.nilai_penyimpangan_diizinkan}</td><td>${r0(h.ketidakpastian_U)}</td>`;
      body += '</tr>';
    });
  }
  return `
    <table class="perf">
      <tr>
        <th>No.</th><th>Parameter</th><th>Setting Standar</th><th>Rata-Rata Pembacaan UUT</th>
        <th>Koreksi</th><th>Nilai Penyimpangan yang diizinkan</th><th>Ketidakpastian Pengukuran</th>
      </tr>
      <tr>
        <th class="unit"></th><th class="unit"></th><th class="unit">(${satuan})</th><th class="unit">(${satuan})</th>
        <th class="unit">(${satuan})</th><th class="unit"></th><th class="unit">(${satuan})</th>
      </tr>
      ${body}
    </table>`;
}

function groupHasil(d){
  const groupOrder = [];
  const groups = {};
  d.hasil.forEach(h => {
    if (!groups[h.parameter_group]) { groups[h.parameter_group] = []; groupOrder.push(h.parameter_group); }
    groups[h.parameter_group].push(h);
  });
  return { groupOrder, groups };
}

function renderLaporan(j, model, d){
  const fisikBaik = d.fisik.length > 0 && d.fisik.every(f => f.fisik === 'Baik' && f.fungsi === 'Baik');
  const { groupOrder, groups } = groupHasil(d);
  const isMultiGroup = groupOrder.length > 1;
  const letters = 'abcdefgh';
  const perfHtml = groupOrder.map((g, i) => {
    const rows = groups[g];
    const satuan = (d.hasil.find(h => h.parameter_group === g) || {}).satuan || '';
    const label = GROUP_LABEL[g] || g;
    const heading = isMultiGroup
      ? `<div class="subsec">${letters[i]}. ${label}${satuan ? ' (' + satuan + ')' : ''}</div>`
      : '';
    return heading + renderPerfTable(g, rows, satuan);
  }).join('');

  const keteranganItems = [];
  if (model.catatan_klasifikasi) keteranganItems.push(esc(model.catatan_klasifikasi));
  keteranganItems.push('Hasil Ketidakpastian pengukuran disajikan mempunyai tingkat kepercayaan 95% dengan Faktor Cakupan (K)=2');
  if (model.metode_rujukan_text) keteranganItems.push(esc(model.metode_rujukan_text));

  const hasilText = j.hasil_akhir === 'LAIK' ? 'ALAT BAIK DAN LAIK PAKAI' : 'TIDAK LAIK PAKAI';
  const alatDigunakan = [model.alat_standar_1, model.alat_standar_2].filter(Boolean);

  return `
  <div class="page">
    <h1 class="title">LAPORAN HASIL KALIBRASI</h1>
    <div class="headrow"><div>No. Sertifikat : <b>${esc(j.no_sertifikat) || '-'}</b></div></div>

    <div class="sectiontitle">I. Data Alat</div>
    <table class="fields">
      ${fieldRow(1, 'Nama Alat', esc(model.nama_alat_formal))}
      ${fieldRow(2, 'Merek', esc(j.merk))}
      ${fieldRow(3, 'Model/Tipe', esc(j.tipe_model_alat))}
      ${fieldRow(4, 'No. Seri', esc(j.no_seri))}
      ${fieldRow(5, 'Kelas Proteksi', `<b>${esc(model.kelas_proteksi_default)}</b>`)}
      ${fieldRow(6, 'Tipe Applied Parts', `<b>${esc(model.tipe_applied_parts_default)}</b>`)}
      ${fieldRow(7, 'Tanggal Kalibrasi', `<b>${fmtTgl(j.tanggal_kalibrasi)}</b>`)}
    </table>

    <div class="sectiontitle">II. Kondisi Lingkungan</div>
    <table class="fields">
      ${fieldRow(1, 'Suhu', `(${r0(j.suhu_awal)} - ${r0(j.suhu_akhir)}) °C`)}
      ${fieldRow(2, 'Kelembapan', `(${r0(j.rh_awal)} - ${r0(j.rh_akhir)}) %RH`)}
    </table>

    <div class="sectiontitle">III. Pemeriksaan Kondisi Fisik dan Fungsi</div>
    <table class="fields">
      ${fieldRow(1, 'Fisik', fisikBaik ? 'Baik' : 'Tidak Baik')}
      ${fieldRow(2, 'Fungsi', fisikBaik ? 'Baik' : 'Tidak Baik')}
    </table>

    <div class="sectiontitle">IV. Hasil Pengukuran Kinerja</div>
    ${perfHtml}

    <div class="sectiontitle">V. Keterangan</div>
    <table class="fields">
      ${keteranganItems.map((t,i) => noteRow(i+1, t)).join('')}
      ${noteRow(keteranganItems.length+1, `Hasil kalibrasi ${esc(model.nama_alat_formal)} dinyatakan, <b>${hasilText}</b>`)}
      ${noteRow(keteranganItems.length+2, 'Hasil Kalibrasi diatas hanya untuk alat yang tertera pada Sertifikat ini')}
    </table>

    ${alatDigunakan.length ? `
    <div class="sectiontitle">VI. Alat Yang Digunakan</div>
    <table class="fields">
      ${alatDigunakan.map((t,i) => noteRow(i+1, esc(t))).join('')}
    </table>` : ''}

    <div class="diperiksa">
      Diperiksa Oleh : <b>${esc(j.disahkan_oleh) || '.......................'}</b>
    </div>

    <div class="akhir">Akhir Sertifikat</div>

    ${dblRuleHtml()}
    <div class="footnote">
      Sertifikat ini dilarang digandakan kecuali sepenuhnya tanpa persetujuan tertulis oleh Laboratorium Kalibrasi PT. Sinko Prima Alloy.<br>
      This Certificate shall not reproduce except in full without written approval of PT. Sinko Prima Alloy Calibration Laboratory.
    </div>
    <div class="tglbuat">tanggal pembuatan : ${fmtTgl(j.tanggal_terbit_pdf || new Date())}</div>

    <div class="pagefooter">
      <span></span>
      <span class="pageno">Page 2 of 2</span>
      <span class="docnum">Nomor Dokumen: SPA-FR/LAB-04PBK, Rev.01</span>
    </div>
  </div>`;
}

/* ============ EXPORT EXCEL (xlsx-js-style) ============ */
const FS = { name:'Times New Roman' };
const THIN = { style:'thin', color:{ rgb:'999999' } };
const BORDER = { top:THIN, bottom:THIN, left:THIN, right:THIN };
const S = {
  title:      { font:{ ...FS, bold:true, sz:14 }, alignment:{ horizontal:'center', vertical:'center', wrapText:true } },
  titleEn:    { font:{ ...FS, sz:10.5 }, alignment:{ horizontal:'center' } },
  head:       { font:{ ...FS, sz:9.5 }, alignment:{ horizontal:'center' } },
  section:    { font:{ ...FS, bold:true, sz:12 } },
  sectionsub: { font:{ ...FS, italic:true, sz:9 } },
  no:         { font:{ ...FS, sz:10.5 }, alignment:{ horizontal:'right' } },
  labelId:    { font:{ ...FS, bold:true, sz:10.5 } },
  labelEn:    { font:{ ...FS, sz:10.5 } },
  labelIdOnly:{ font:{ ...FS, bold:true, sz:10.5 } },
  colon:      { font:{ ...FS, bold:true, sz:10.5 }, alignment:{ horizontal:'center' } },
  val:        { font:{ ...FS, sz:10.5 } },
  valBold:    { font:{ ...FS, bold:true, sz:10.5 } },
  th:         { font:{ ...FS, bold:true, sz:9 }, alignment:{ horizontal:'center', vertical:'center', wrapText:true }, fill:{ fgColor:{ rgb:'F3F3F3' } }, border:BORDER },
  thUnit:     { font:{ ...FS, sz:8 }, alignment:{ horizontal:'center', vertical:'center' }, fill:{ fgColor:{ rgb:'F8F8F8' } }, border:BORDER },
  td:         { font:{ ...FS, sz:9.5 }, alignment:{ horizontal:'center', vertical:'center' }, border:BORDER },
  sign:       { font:{ ...FS, sz:10.5 }, alignment:{ horizontal:'center' } },
  signB:      { font:{ ...FS, bold:true, sz:10.5 }, alignment:{ horizontal:'center' } },
  signI:      { font:{ ...FS, italic:true, sz:9 }, alignment:{ horizontal:'center' } },
  footnote:   { font:{ ...FS, sz:8 }, alignment:{ horizontal:'center', wrapText:true } },
  docfoot:    { font:{ ...FS, italic:true, sz:8 }, alignment:{ horizontal:'right' } }
};

function put(ws, r, c, v, s){
  ws[XLSX.utils.encode_cell({r,c})] = { t: typeof v === 'number' ? 'n' : 's', v: (v===undefined||v===null) ? '' : v, s: s };
}
function merge(ws, r1,c1,r2,c2){
  if(!ws['!merges']) ws['!merges']=[];
  ws['!merges'].push({ s:{r:r1,c:c1}, e:{r:r2,c:c2} });
}
const NCOL = 8;

function rowLabelBi(ws, r, no, idLabel, enLabel, value, sVal){
  put(ws, r, 0, no, S.no);
  put(ws, r, 1, idLabel + ' /', S.labelId);
  put(ws, r, 4, enLabel, S.labelEn); merge(ws, r,4, r,5);
  merge(ws, r,1, r,3);
  put(ws, r, 6, ':', S.colon);
  put(ws, r, 7, value, sVal || S.val);
}
function rowLabel(ws, r, no, label, value, sVal){
  put(ws, r, 0, no, S.no);
  put(ws, r, 1, label, S.labelIdOnly); merge(ws, r,1, r,5);
  put(ws, r, 6, ':', S.colon);
  put(ws, r, 7, value, sVal || S.val);
}
function rowNote(ws, r, no, text, sVal){
  put(ws, r, 0, no, S.no);
  put(ws, r, 1, text, sVal || S.val); merge(ws, r,1, r,7);
}
function sectionTitle(ws, r, text){
  put(ws, r, 0, text, S.section); merge(ws, r,0, r,NCOL-1);
}
function sectionSub(ws, r, text){
  put(ws, r, 0, text, S.sectionsub); merge(ws, r,0, r,NCOL-1);
}

function buildSertifikatSheet(j, model){
  const ws = {};
  let r = 0;
  put(ws, r, 0, 'SERTIFIKAT KALIBRASI', S.title); merge(ws, r,0, r,NCOL-1); r++;
  put(ws, r, 0, 'Calibration Certificate', S.titleEn); merge(ws, r,0, r,NCOL-1); r+=2;

  put(ws, r, 2, 'No Sertifikat : ' + (esc(j.no_sertifikat) || '-'), S.head); merge(ws, r,2, r,3);
  put(ws, r, 5, 'No Order : ' + esc(j.no_order), S.head); merge(ws, r,5, r,6); r+=2;

  sectionTitle(ws, r, 'Identifikasi Alat'); r++;
  sectionSub(ws, r, 'Equipment Identification'); r++;
  rowLabelBi(ws, r++, 1, 'Nama Alat', 'Name of Equipment', esc(model.nama_alat_formal));
  rowLabelBi(ws, r++, 2, 'Merk Pabrik', 'Manufacturer', esc(j.merk));
  rowLabelBi(ws, r++, 3, 'Tipe / Model', 'Type / Model', esc(j.tipe_model_alat));
  rowLabelBi(ws, r++, 4, 'No.Seri', 'Serial Number', esc(j.no_seri));
  rowLabelBi(ws, r++, 5, 'Tanggal Penerimaan', 'Receipt Date', fmtTgl(j.tanggal_terima)); r++;

  sectionTitle(ws, r, 'Identitas Pemilik'); r++;
  sectionSub(ws, r, "Owner's Identity"); r++;
  rowLabelBi(ws, r++, 1, 'Nama Pelanggan', "Customer's Name", esc(j.nama_pelanggan));
  rowLabelBi(ws, r++, 2, 'Alamat', 'Address', esc(j.alamat_pelanggan)); r++;

  sectionTitle(ws, r, 'Pelaksanaan Kalibrasi'); r++;
  sectionSub(ws, r, 'Implementation of Calibration'); r++;
  rowLabelBi(ws, r++, 1, 'Tempat', 'Place', esc(model.tempat_kalibrasi_default));
  rowLabelBi(ws, r++, 2, 'Ruangan', 'Room', esc(model.ruang_kalibrasi_default));
  rowLabelBi(ws, r++, 3, 'Tanggal Kalibrasi', 'Cal Date', fmtTgl(j.tanggal_kalibrasi));
  rowLabelBi(ws, r++, 4, 'Tanggal Berakhir', 'Cal Due Date', tglBerakhir(j.tanggal_kalibrasi));
  rowLabelBi(ws, r++, 5, 'Metode', 'Method', esc(model.metode));
  const hasilText = j.hasil_akhir === 'LAIK' ? 'ALAT BAIK DAN LAIK PAKAI' : 'TIDAK LAIK PAKAI';
  rowLabelBi(ws, r++, 6, 'Hasil Kalibrasi', 'Calibration Result', hasilText, S.valBold);
  r += 2;

  const managerMutu = model.manager_mutu_default || j.disahkan_oleh || '.......................';
  put(ws, r, 5, 'Surabaya, ' + fmtTgl(j.tanggal_terbit_pdf || new Date()), S.sign); merge(ws, r,5, r,7); r++;
  put(ws, r, 5, 'Menyetujui,', S.sign); merge(ws, r,5, r,7); r++;
  put(ws, r, 5, 'Approved,', S.signI); merge(ws, r,5, r,7); r+=3;
  put(ws, r, 5, managerMutu, S.signB); merge(ws, r,5, r,7); r++;
  put(ws, r, 5, 'Manager Mutu', S.sign); merge(ws, r,5, r,7); r++;
  put(ws, r, 5, 'Quality Manager', S.signI); merge(ws, r,5, r,7); r+=2;

  for(let c=0;c<NCOL;c++) put(ws, r, c, '', { border:{ top:{ style:'medium', color:{rgb:'000000'} } } });
  r++;
  for(let c=0;c<NCOL;c++) put(ws, r, c, '', { border:{ top:{ style:'medium', color:{rgb:'000000'} } } });
  r++;

  put(ws, r, 0, 'Sertifikat ini dilarang digandakan kecuali sepenuhnya tanpa persetujuan tertulis oleh Laboratorium Kalibrasi PT. Sinko Prima Alloy.', S.footnote);
  merge(ws, r,0, r,NCOL-1); r++;
  put(ws, r, 0, 'This Certificate shall not reproduce except in full without written approval of PT. Sinko Prima Alloy Calibration Laboratory.', S.footnote);
  merge(ws, r,0, r,NCOL-1); r+=2;

  put(ws, r, 0, 'Page 1 of 2', S.footnote); merge(ws, r,0, r,4);
  put(ws, r, 5, 'Nomor Dokumen:SPA-FR/LAB-03PBK', S.docfoot); merge(ws, r,5, r,7);

  ws['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:r+2,c:NCOL-1} });
  ws['!cols'] = [ {wch:4},{wch:11},{wch:11},{wch:11},{wch:12},{wch:12},{wch:3},{wch:16} ];
  return ws;
}

function perfRowsToAoa(ws, r, rows, satuan, multi){
  if (!multi){
    put(ws,r,0,'No',S.th); put(ws,r,1,'Pembacaan Standar',S.th); merge(ws,r,1,r,2);
    put(ws,r,3,'Rata-rata Pembacaan Alat',S.th); merge(ws,r,3,r,4);
    put(ws,r,5,'Koreksi',S.th); put(ws,r,6,'Nilai Penyimpangan yang diizinkan',S.th); put(ws,r,7,'Ketidakpastian Pengukuran',S.th);
    r++;
    put(ws,r,0,'',S.thUnit); put(ws,r,1,'('+satuan+')',S.thUnit); merge(ws,r,1,r,2);
    put(ws,r,3,'('+satuan+')',S.thUnit); merge(ws,r,3,r,4);
    put(ws,r,5,'('+satuan+')',S.thUnit); put(ws,r,6,'',S.thUnit); put(ws,r,7,'('+satuan+')',S.thUnit);
    r++;
    rows.forEach((h,i) => {
      put(ws,r,0,i+1,S.td); put(ws,r,1,h.nilai_setting,S.td); merge(ws,r,1,r,2);
      put(ws,r,3,r0n(h.rata_rata_pembacaan),S.td); merge(ws,r,3,r,4);
      put(ws,r,5,r0n(h.koreksi),S.td); put(ws,r,6,esc(h.nilai_penyimpangan_diizinkan),S.td); put(ws,r,7,r0n(h.ketidakpastian_U),S.td);
      r++;
    });
    return r;
  }
  const subs = [...new Set(rows.map(x => x.sub_parameter))];
  const nSub = subs.length;
  put(ws,r,0,'No.',S.th); put(ws,r,1,'Parameter',S.th); put(ws,r,2,'Setting Standar',S.th);
  put(ws,r,3,'Rata-Rata Pembacaan UUT',S.th); put(ws,r,4,'Koreksi',S.th);
  put(ws,r,5,'Nilai Penyimpangan yang diizinkan',S.th); merge(ws,r,5,r,6);
  put(ws,r,7,'Ketidakpastian Pengukuran',S.th);
  r++;
  put(ws,r,0,'',S.thUnit); put(ws,r,1,'',S.thUnit); put(ws,r,2,'('+satuan+')',S.thUnit);
  put(ws,r,3,'('+satuan+')',S.thUnit); put(ws,r,4,'('+satuan+')',S.thUnit);
  put(ws,r,5,'',S.thUnit); merge(ws,r,5,r,6);
  put(ws,r,7,'('+satuan+')',S.thUnit);
  r++;
  for (let i=0; i<rows.length; i+=nSub){
    const chunk = rows.slice(i, i+nSub);
    const startR = r;
    chunk.forEach((h,k) => {
      put(ws,r,1,h.sub_parameter,S.td);
      put(ws,r,2,h.nilai_setting,S.td);
      put(ws,r,3,r0n(h.rata_rata_pembacaan),S.td);
      put(ws,r,4,r0n(h.koreksi),S.td);
      put(ws,r,5,esc(h.nilai_penyimpangan_diizinkan),S.td); merge(ws,r,5,r,6);
      put(ws,r,7,r0n(h.ketidakpastian_U),S.td);
      r++;
    });
    put(ws,startR,0,(i/nSub)+1,S.td);
    if (nSub>1) merge(ws,startR,0,startR+nSub-1,0);
  }
  return r;
}

function buildLaporanSheet(j, model, d){
  const ws = {};
  let r = 0;
  put(ws, r, 0, 'LAPORAN HASIL KALIBRASI', S.title); merge(ws, r,0, r,NCOL-1); r+=2;
  put(ws, r, 5, 'No. Sertifikat : ' + (esc(j.no_sertifikat) || '-'), S.head); merge(ws, r,5, r,7); r+=2;

  sectionTitle(ws, r, 'I. Data Alat'); r++;
  rowLabel(ws, r++, 1, 'Nama Alat', esc(model.nama_alat_formal));
  rowLabel(ws, r++, 2, 'Merek', esc(j.merk));
  rowLabel(ws, r++, 3, 'Model/Tipe', esc(j.tipe_model_alat));
  rowLabel(ws, r++, 4, 'No. Seri', esc(j.no_seri));
  rowLabel(ws, r++, 5, 'Kelas Proteksi', esc(model.kelas_proteksi_default), S.valBold);
  rowLabel(ws, r++, 6, 'Tipe Applied Parts', esc(model.tipe_applied_parts_default), S.valBold);
  rowLabel(ws, r++, 7, 'Tanggal Kalibrasi', fmtTgl(j.tanggal_kalibrasi), S.valBold); r++;

  sectionTitle(ws, r, 'II. Kondisi Lingkungan'); r++;
  rowLabel(ws, r++, 1, 'Suhu', '(' + r0(j.suhu_awal) + ' - ' + r0(j.suhu_akhir) + ') °C');
  rowLabel(ws, r++, 2, 'Kelembapan', '(' + r0(j.rh_awal) + ' - ' + r0(j.rh_akhir) + ') %RH'); r++;

  const fisikBaik = d.fisik.length > 0 && d.fisik.every(f => f.fisik === 'Baik' && f.fungsi === 'Baik');
  sectionTitle(ws, r, 'III. Pemeriksaan Kondisi Fisik dan Fungsi'); r++;
  rowLabel(ws, r++, 1, 'Fisik', fisikBaik ? 'Baik' : 'Tidak Baik');
  rowLabel(ws, r++, 2, 'Fungsi', fisikBaik ? 'Baik' : 'Tidak Baik'); r++;

  sectionTitle(ws, r, 'IV. Hasil Pengukuran Kinerja'); r++;
  const { groupOrder, groups } = groupHasil(d);
  const isMultiGroup = groupOrder.length > 1;
  const letters = 'abcdefgh';
  groupOrder.forEach((g, i) => {
    const rows = groups[g];
    const satuan = (d.hasil.find(h => h.parameter_group === g) || {}).satuan || '';
    const isMulti = [...new Set(rows.map(x=>x.sub_parameter))].length > 1;
    if (isMultiGroup){
      const label = GROUP_LABEL[g] || g;
      put(ws, r, 0, letters[i] + '. ' + label + (satuan ? ' (' + satuan + ')' : ''), S.section);
      merge(ws, r,0, r,NCOL-1); r++;
    }
    r = perfRowsToAoa(ws, r, rows, satuan, isMulti);
    r++;
  });

  const keteranganItems = [];
  if (model.catatan_klasifikasi) keteranganItems.push(esc(model.catatan_klasifikasi));
  keteranganItems.push('Hasil Ketidakpastian pengukuran disajikan mempunyai tingkat kepercayaan 95% dengan Faktor Cakupan (K)=2');
  if (model.metode_rujukan_text) keteranganItems.push(esc(model.metode_rujukan_text));
  const hasilText = j.hasil_akhir === 'LAIK' ? 'ALAT BAIK DAN LAIK PAKAI' : 'TIDAK LAIK PAKAI';

  sectionTitle(ws, r, 'V. Keterangan'); r++;
  keteranganItems.forEach((t,i) => { rowNote(ws, r++, i+1, t); });
  rowNote(ws, r++, keteranganItems.length+1, 'Hasil kalibrasi ' + esc(model.nama_alat_formal) + ' dinyatakan, ' + hasilText, S.valBold);
  rowNote(ws, r++, keteranganItems.length+2, 'Hasil Kalibrasi diatas hanya untuk alat yang tertera pada Sertifikat ini');
  r++;

  const alatDigunakan = [model.alat_standar_1, model.alat_standar_2].filter(Boolean);
  if (alatDigunakan.length){
    sectionTitle(ws, r, 'VI. Alat Yang Digunakan'); r++;
    alatDigunakan.forEach((t,i) => { rowNote(ws, r++, i+1, esc(t)); });
    r++;
  }

  put(ws, r, 0, 'Diperiksa Oleh : ' + (esc(j.disahkan_oleh) || '.......................'), S.val); merge(ws, r,0, r,NCOL-1); r+=2;
  put(ws, r, 0, 'Akhir Sertifikat', S.labelIdOnly); merge(ws, r,0, r,NCOL-1); r+=2;

  for(let c=0;c<NCOL;c++) put(ws, r, c, '', { border:{ top:{ style:'medium', color:{rgb:'000000'} } } });
  r++;
  for(let c=0;c<NCOL;c++) put(ws, r, c, '', { border:{ top:{ style:'medium', color:{rgb:'000000'} } } });
  r++;

  put(ws, r, 0, 'Sertifikat ini dilarang digandakan kecuali sepenuhnya tanpa persetujuan tertulis oleh Laboratorium Kalibrasi PT. Sinko Prima Alloy.', S.footnote);
  merge(ws, r,0, r,NCOL-1); r++;
  put(ws, r, 0, 'This Certificate shall not reproduce except in full without written approval of PT. Sinko Prima Alloy Calibration Laboratory.', S.footnote);
  merge(ws, r,0, r,NCOL-1); r++;
  put(ws, r, 0, 'tanggal pembuatan : ' + fmtTgl(j.tanggal_terbit_pdf || new Date()), S.footnote);
  merge(ws, r,0, r,NCOL-1); r+=2;

  put(ws, r, 0, 'Page 2 of 2', S.footnote); merge(ws, r,0, r,4);
  put(ws, r, 5, 'Nomor Dokumen: SPA-FR/LAB-04PBK, Rev.01', S.docfoot); merge(ws, r,5, r,7);

  ws['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:r+2,c:NCOL-1} });
  ws['!cols'] = [ {wch:5},{wch:14},{wch:14},{wch:14},{wch:12},{wch:14},{wch:8},{wch:14} ];
  return ws;
}

/* ============ PENGATURAN HALAMAN CETAK — margin, paper size, print area ============ */
function applyPrintSetup(ws){
  // Margin dalam INCI (satuan yang dipakai SheetJS) — dibuat rapat karena konten padat di 1 halaman
  ws['!margins'] = { left:0.35, right:0.3, top:0.4, bottom:0.3, header:0.2, footer:0.2 };
  // paperSize 14 = Folio (215.9 x 330.2mm) — kode kertas Excel standar paling dekat dengan F4
  ws['!pageSetup'] = { paperSize: 14, orientation: 'portrait', fitToWidth: 1, fitToHeight: 1, scale: 100 };
  ws['!fitToPage'] = true;
  return ws['!ref'];
}

function downloadExcel(j, model, d){
  const wb = XLSX.utils.book_new();
  const ws1 = buildSertifikatSheet(j, model);
  const ws2 = buildLaporanSheet(j, model, d);

  const ref1 = applyPrintSetup(ws1);
  const ref2 = applyPrintSetup(ws2);

  XLSX.utils.book_append_sheet(wb, ws1, 'SERTIFIKAT');
  XLSX.utils.book_append_sheet(wb, ws2, 'Laporan Hasil Kalibrasi');

  wb.Workbook = wb.Workbook || {};
  wb.Workbook.Names = wb.Workbook.Names || [];
  const range1 = XLSX.utils.decode_range(ref1);
  const range2 = XLSX.utils.decode_range(ref2);
  wb.Workbook.Names.push({
    Sheet: 0, Name: '_xlnm.Print_Area',
    Ref: `'SERTIFIKAT'!$A$1:$${XLSX.utils.encode_col(range1.e.c)}$${range1.e.r + 1}`
  });
  wb.Workbook.Names.push({
    Sheet: 1, Name: '_xlnm.Print_Area',
    Ref: `'Laporan Hasil Kalibrasi'!$A$1:$${XLSX.utils.encode_col(range2.e.c)}$${range2.e.r + 1}`
  });

  XLSX.writeFile(wb, 'Sertifikat_' + j.job_id + '.xlsx');
}

/* ============ INIT ============ */
let CURRENT = null;

async function init(){
  const params = new URLSearchParams(location.search);
  const jobId = params.get('job_id');
  const overlay = document.getElementById('loadingOverlay');

  if (!jobId){
    overlay.classList.add('hide');
    document.getElementById('content').innerHTML = '<p style="text-align:center;padding:40px;font-family:Arial">Parameter job_id tidak ada di URL.</p>';
    return;
  }

  let d;
  try{ d = await apiGet('jobDetail', { job_id: jobId }); }
  catch(err){
    overlay.classList.add('hide');
    document.getElementById('content').innerHTML = '<p style="text-align:center;padding:40px;font-family:Arial">Tidak bisa terhubung ke server API.</p>';
    return;
  }
  if (d.error){
    overlay.classList.add('hide');
    document.getElementById('content').innerHTML = '<p style="text-align:center;padding:40px;font-family:Arial">' + d.error + '</p>';
    return;
  }
  const j = d.job;

  const modelCfg = await apiGet('config', { model_id: j.model_id });
  if (modelCfg.error || !modelCfg.model){
    overlay.classList.add('hide');
    document.getElementById('content').innerHTML = '<p style="text-align:center;padding:40px;font-family:Arial">Config model tidak ditemukan untuk model_id: ' + j.model_id + '</p>';
    return;
  }
  const model = modelCfg.model;

  document.getElementById('jobLabel').textContent = j.job_id + ' — ' + j.nama_pelanggan + ' (' + (j.no_sertifikat || 'belum terbit') + ')';
  document.getElementById('content').innerHTML = renderSertifikat(j, model) + renderLaporan(j, model, d);
  overlay.classList.add('hide');

  CURRENT = { j, model, d };

  const sudahTerbit = !!j.no_sertifikat && (j.status === 'Terbit' || j.status === 'Arsip');
  const btnPrint = document.getElementById('btnPrint');
  const btnExcel = document.getElementById('btnExcel');
  const note = document.getElementById('statusNote');

  if (sudahTerbit){
    btnPrint.disabled = false;
    btnExcel.disabled = false;
    note.style.display = 'none';
  } else {
    btnPrint.disabled = true;
    btnExcel.disabled = true;
    note.style.display = 'block';
    note.textContent = 'Sertifikat belum terbit (status: ' + j.status + ') — cetak & unduh Excel dinonaktifkan sampai diterbitkan lewat halaman Verifikasi.';
  }

  btnPrint.addEventListener('click', () => window.print());
  btnExcel.addEventListener('click', () => {
    if (!CURRENT) return;
    if (typeof XLSX === 'undefined'){ alert('Pustaka Excel gagal dimuat. Cek koneksi internet lalu muat ulang halaman.'); return; }
    downloadExcel(CURRENT.j, CURRENT.model, CURRENT.d);
  });
}
init();
